name: Verify framework
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npm run test:preview
      - run: npm run test:integration
      - run: npm run test:gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            projects/demo-fuel-prices/renders/integration/
            projects/demo-fuel-prices/renders/preview/
            projects/scene-gallery/renders/integration/
